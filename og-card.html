<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{
  width:1200px;height:630px;overflow:hidden;
  background:#0d0d0f;
  font-family:'DM Sans',sans-serif;color:#f0efe8;
  display:flex;align-items:center;justify-content:center;
  position:relative;
}
body::before{
  content:'';position:absolute;inset:0;
  background:
    radial-gradient(ellipse 55% 65% at 50% -10%, rgba(124,111,239,.30), transparent),
    radial-gradient(ellipse 40% 45% at 90% 110%, rgba(62,207,142,.12), transparent);
}
.box{position:relative;text-align:center;padding:0 80px}
.pill{
  display:inline-block;margin-bottom:34px;
  transform:rotate(45deg);
  width:64px;height:130px;position:relative;
}
.pill .top{position:absolute;inset:0;border-radius:32px;background:#7c6fef}
.pill .bottom{position:absolute;left:0;right:0;bottom:0;height:50%;border-radius:0 0 32px 32px;background:#f0efe8}
.pill .shine{position:absolute;left:12px;top:14px;width:11px;height:44px;border-radius:6px;background:rgba(255,255,255,.45)}
.logo{
  font-family:'Syne',sans-serif;font-weight:800;
  font-size:88px;letter-spacing:.08em;line-height:1;
}
.logo span{color:#7c6fef}
.tag{
  margin-top:26px;font-size:34px;color:#b9b9c6;font-weight:400;
}
.tag b{color:#f0efe8;font-weight:500}
.foot{
  position:absolute;bottom:44px;left:0;right:0;
  text-align:center;font-size:24px;color:#7c6fef;
  letter-spacing:.05em;font-weight:500;
}
</style>
</head>
<body>
  <div class="box">
    <div class="pill"><div class="top"></div><div class="bottom"></div><div class="shine"></div></div>
    <div class="logo">TAIN<span>TY</span></div>
    <div class="tag">Fabricamos <b>los productos de tu marca</b> — suplementos,<br>dermocosmética y más · desde 100 unidades</div>
  </div>
  <div class="foot">taintycorporation.pe</div>
</body>
</html>
